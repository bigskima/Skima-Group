name: Production build gate

on:
  push:
    branches: [main, financial-core-revenue-payouts]
    paths: &build_paths
      - "apps/admin/**"
      - "apps/lpg-mobile/**"
      - "packages/frontend-core/**"
      - "packages/ui/**"
      - "packages/core/**"
      - "packages/config/**"
      - "packages/events/**"
      - "packages/adapters/**"
      - "packages/auth/**"
      - "packages/engines/**"
      - "packages/modules/**"
      - "packages/mobile-design/**"
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "deno.json"
      - "supabase/migration-history-policy.json"
      - "scripts/verify-migration-history.ts"
      - "scripts/validate-foundation.ts"
      - "scripts/verify-financial-policy-governance.ts"
      - "scripts/skima-whatsapp-lifecycle-contract.test.ts"
      - "scripts/in-app-guide-target-contract.test.ts"
      - "scripts/payout-runtime-production-contract.test.ts"
      - "scripts/verification-runtime-contract.test.ts"
      - "scripts/ai-*.test.ts"
      - "package.json"
      - "vercel.json"
      - "vercel.admin.json"
      - ".github/workflows/production-build-gate.yml"
  pull_request:
    branches: [main]
    paths: *build_paths
  workflow_dispatch:

concurrency:
  group: production-build-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migration-history:
    name: Migration static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Use Deno 2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck platform and edge functions
        run: npm run check
      - name: Verify migration history policy
        run: npm run migration-history:verify
      - name: Validate migration foundation
        run: npm run validate
      - name: Verify financial policy governance
        run: npm run financial-governance:verify
      - name: Verify AI runtime contracts
        run: npm run ai-runtime:contract
      - name: Verify LPG refill production contracts
        run: npm run lpg-refill:contract
      - name: Verify keyless interactive map contracts
        run: npm run location-maps:contract
      - name: Verify independent driver vehicle onboarding contracts
        run: npm run lpg-driver-vehicle:contract
      - name: Verify independent driver vehicle location review contracts
        run: npm run lpg-vehicle-location:contract
      - name: Verify Station Managed fulfillment, driver and admin contracts
        run: npm run station-managed:verify
      - name: Verify SKIMA WhatsApp lifecycle contracts
        run: npm run whatsapp:contract
      - name: Verify in-app tour route and target alignment
        run: npm run in-app-guide:contract
      - name: Verify LPG auth production contracts
        run: npm run lpg-auth:contract
      - name: Verify payout runtime production contracts
        run: npm run payout-runtime:contract
      - name: Verify Vercel project routing
        run: npm run vercel-ignore:test
      - name: Verify utility billing production contracts
        run: npm run utility-billing:contract
      - name: Verify automatic verification production contracts
        run: npm run verification-runtime:contract

  admin-web:
    name: Admin production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install admin dependencies
        run: npm install --no-audit --no-fund
      - name: Test SKIMA fleet document upload
        run: npm run frontend:test -- src/admin-skima-fleet-compliance-workspace.test.tsx
      - name: Typecheck and build admin
        run: npm run deploy:check:admin

  lpg-web:
    name: LPG production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/lpg-mobile/package-lock.json
      - name: Install LPG dependencies exactly as Vercel
        run: npm --prefix apps/lpg-mobile ci --no-audit --no-fund
      - name: Typecheck and build LPG web
        run: npm run deploy:check:lpg

  station-managed-db-validation:
    name: Station Managed local database migration validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start ephemeral local Supabase and apply schema migrations
        shell: bash
        run: |
          set -euo pipefail
          # These two legacy data-only migrations require live owner/admin identities.
          # A blank local database intentionally has no such identity. Skip only these
          # one-time data updates; retain all schema, function, policy and feature migrations.
          backup_dir="$(mktemp -d)"
          legacy_migrations=(
            "supabase/migrations/20260813044000_retire_legacy_lpg_commercial_rates.sql"
            "supabase/migrations/20260906035426_awka_legacy_area_mapping.sql"
          )
          restore_legacy_migrations() {
            for backup_file in "$backup_dir"/*.sql; do
              [ -f "$backup_file" ] || continue
              mv "$backup_file" "supabase/migrations/$(basename "$backup_file")"
            done
            rmdir "$backup_dir" 2>/dev/null || true
          }
          for migration in "${legacy_migrations[@]}"; do
            mv "$migration" "$backup_dir/"
          done
          trap restore_legacy_migrations EXIT
          supabase start
          # Startup only launches the local stack; reset explicitly applies every
          # remaining migration to a clean ephemeral database. Never targets remote.
          supabase db reset --local --no-seed
      - name: Stop ephemeral local Supabase
        if: always()
        run: supabase stop --no-backup
