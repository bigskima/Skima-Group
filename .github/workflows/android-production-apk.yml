name: Android EAS build

on:
  push:
    branches: [main]
    # Only native-affecting Refill changes run the Expo validation job.
    # Web-only PWA assets, HTML shells and web export script edits do not.
    paths:
      - "apps/lpg-mobile/app.config.ts"
      - "apps/lpg-mobile/eas.json"
      - "apps/lpg-mobile/package-lock.json"
      - "apps/lpg-mobile/assets/**"
      - "apps/lpg-mobile/app/**"
      - "apps/lpg-mobile/src/native/**"
      - "apps/lpg-mobile/scripts/**"
      - "packages/frontend-core/**"
      - "packages/mobile-experience/**"
  workflow_dispatch:
    inputs:
      build_profile:
        description: EAS Android build profile
        required: true
        type: choice
        options:
          - preview
          - development
          - production
          - production-apk
        default: production
      clear_cache:
        description: Clear the EAS build cache before building
        required: false
        type: boolean
        default: false

concurrency:
  group: skima-lpg-android-${{ github.event_name == 'workflow_dispatch' && inputs.build_profile || 'validate' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate Expo app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/lpg-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/lpg-mobile/package-lock.json

      - name: Install LPG dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run check

      - name: Validate Expo dependencies and native configuration
        run: |
          if npx expo install --check; then
            echo "Expo SDK package versions are aligned."
          else
            echo "::warning::Expo reports SDK package patch-version drift. No native packages were changed automatically; review the reported versions before the next native release."
          fi
          npx expo config --type public > /dev/null

  build:
    name: Build Android (${{ inputs.build_profile }})
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/lpg-mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/lpg-mobile/package-lock.json

      - name: Install LPG dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Expo CI token
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing GitHub secret EXPO_TOKEN."
            exit 1
          fi

      - name: Validate selected EAS profile
        run: npx --yes eas-cli@latest config --platform android --profile "${{ inputs.build_profile }}" --non-interactive > /dev/null

      - name: Build selected Android profile on EAS
        shell: bash
        run: |
          BUILD_ARGS=(build --platform android --profile "${{ inputs.build_profile }}" --non-interactive --wait)

          if [ "${{ inputs.clear_cache }}" = "true" ]; then
            BUILD_ARGS+=(--clear-cache)
          fi

          npx --yes eas-cli@latest "${BUILD_ARGS[@]}"
