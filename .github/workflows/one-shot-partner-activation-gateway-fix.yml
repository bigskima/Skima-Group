name: One-shot partner activation gateway fix

on:
  push:
    paths:
      - .github/workflows/one-shot-partner-activation-gateway-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch API gateway activation semantics
        shell: python
        run: |
          from pathlib import Path

          path = Path("supabase/functions/api-gateway/index.ts")
          text = path.read_text()

          old_projection = '''"id,application_type_id,applicant_user_id,organization_id,workflow_instance_id,assigned_reviewer_user_id,active_version,status,locked_at,submitted_at,decided_at,approved_at,rejected_at,suspended_at,withdrawn_at,activated_subject_type,activated_subject_id,metadata,created_at,updated_at",'''
          new_projection = '''"id,application_type_id,applicant_user_id,organization_id,workflow_instance_id,assigned_reviewer_user_id,active_version,status,operational_status,locked_at,submitted_at,decided_at,approved_at,rejected_at,suspended_at,withdrawn_at,activated_subject_type,activated_subject_id,activated_at,activated_by,metadata,created_at,updated_at",'''
          assert text.count(old_projection) == 1, "application projection target changed"
          text = text.replace(old_projection, new_projection, 1)

          old_station_effect = '''    if (category === "business" && workspace === "station") {
      const stationActivationResult = await input.serviceClient.rpc(
        "activate_configured_lpg_station_branch",
        {
          target_application_id: input.applicationId,
          target_idempotency_key: `${input.idempotencyKey}:station-activation`,
          target_metadata: {
            ...input.metadata,
            finalApplicationDecision: true,
            reviewerUserId: input.reviewerUserId,
          },
          target_source: "skima.application.final_approval",
        },
      );

      if (stationActivationResult.error) {
        return { response: databaseError(stationActivationResult.error, input.id) };
      }

      effects.stationBranchId = stationActivationResult.data;
    }
'''
          new_station_effect = '''    if (category === "business" && workspace === "station") {
      effects.operationalActivation = "pending_admin_activation";
    }
'''
          assert text.count(old_station_effect) == 1, "station approval side-effect target changed"
          text = text.replace(old_station_effect, new_station_effect, 1)

          old_notice = '''  const body = approved
    ? `You can now access your ${workspaceLabel} workspace.`
    : "Review the decision message and submit corrections if requested.";
  const path = approved
    ? input.workspace === "driver"
      ? "/(driver)"
      : input.workspace === "station"
      ? "/(station)"
      : "/(customer)"
    : input.workspace === "driver"
    ? "/(customer)/driver-application"
    : input.workspace === "station"
    ? "/(customer)/station-application"
    : "/(customer)";
'''
          new_notice = '''  const partnerActivationPending = approved &&
    (input.workspace === "driver" || input.workspace === "station");
  const body = approved
    ? partnerActivationPending
      ? `Your ${workspaceLabel} application is approved. Operational activation is pending.`
      : `Your ${workspaceLabel} application has been approved.`
    : "Review the decision message and submit corrections if requested.";
  const path = approved
    ? input.workspace === "driver"
      ? "/(customer)/driver-application"
      : input.workspace === "station"
      ? "/(customer)/station-application"
      : "/(customer)"
    : input.workspace === "driver"
    ? "/(customer)/driver-application"
    : input.workspace === "station"
    ? "/(customer)/station-application"
    : "/(customer)";
'''
          assert text.count(old_notice) == 1, "application approval notice target changed"
          text = text.replace(old_notice, new_notice, 1)

          path.write_text(text)

      - name: Commit patch
        run: |
          git config user.name "skima-platform-bot"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/api-gateway/index.ts
          git diff --cached --check
          git commit -m "Fix partner approval and activation gateway flow"
          git push origin HEAD:main
