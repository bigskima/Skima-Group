name: SKIMA Bills application

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/bills-mobile/**"
      - "apps/lpg-mobile/src/native/ui/UtilityBillsScreen.tsx"
      - "apps/lpg-mobile/src/native/ui/PremiumDashboard.tsx"
      - "apps/logistics-mobile/**"
      - "supabase/migrations/*skima_bills*"
      - "scripts/skima-bills-mobile-contract.test.ts"
      - ".github/workflows/bills-mobile.yml"
  push:
    branches: [main]
    paths:
      - "apps/bills-mobile/**"
      - "supabase/migrations/*skima_bills*"
      - "scripts/skima-bills-mobile-contract.test.ts"
      - ".github/workflows/bills-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bills-mobile:
    name: Bills TypeScript, contract and web export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Bills Expo dependencies
        run: npm --prefix apps/bills-mobile install --no-audit --no-fund
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test Bills backend and integration contracts
        run: deno test --allow-read scripts/skima-bills-mobile-contract.test.ts
      - name: Typecheck Bills app
        run: npm --prefix apps/bills-mobile run check
      - name: Build Bills web export
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          EXPO_PUBLIC_API_GATEWAY_URL: https://example.supabase.co/functions/v1/api-gateway
        run: npm --prefix apps/bills-mobile run build:web
