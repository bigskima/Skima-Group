name: Phase 2 Cloudflare cylinder generation fix

on:
  push:
    branches:
      - phase-2/cloudflare-cylinder-generation-fix
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase2-cloudflare-cylinder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Use Deno 2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply guarded Cloudflare patch
        run: node scripts/apply-phase2-cloudflare-cylinder-fix.mjs

      - name: Typecheck runtime
        run: npm run check

      - name: Verify AI runtime contracts
        run: npm run ai-runtime:contract

      - name: Remove one-shot patch infrastructure
        run: |
          rm scripts/apply-phase2-cloudflare-cylinder-fix.mjs
          rm .github/workflows/phase2-cloudflare-cylinder.yml

      - name: Commit validated Phase 2 source changes
        run: |
          git config user.name "skima-phase-bot"
          git config user.email "skima-phase-bot@users.noreply.github.com"
          git add supabase/functions/runtime-worker/index.ts \
                  scripts/ai-runtime-contract.test.ts \
                  scripts/apply-phase2-cloudflare-cylinder-fix.mjs \
                  .github/workflows/phase2-cloudflare-cylinder.yml
          git commit -m "fix: correct Cloudflare cylinder generation request schema"
          git push origin HEAD:${{ github.ref_name }}
