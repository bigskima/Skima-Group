name: Phase 1 verification and dark mode patch

on:
  push:
    branches:
      - phase-1/verification-dark-mode-hardening
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase1-verification-dark-mode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Use Deno 2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Apply guarded source patches
        run: node scripts/apply-phase1-verification-dark-mode.mjs

      - name: Typecheck platform and verification runtime
        run: npm run check

      - name: Verify automatic verification contracts
        run: npm run verification-runtime:contract

      - name: Install LPG dependencies exactly
        run: npm --prefix apps/lpg-mobile ci --no-audit --no-fund

      - name: Typecheck LPG app
        run: npm run lpg-mobile:check

      - name: Remove one-shot patch infrastructure
        run: |
          rm scripts/apply-phase1-verification-dark-mode.mjs
          rm .github/workflows/phase1-verification-dark-mode.yml

      - name: Commit validated Phase 1 source changes
        run: |
          git config user.name "skima-phase-bot"
          git config user.email "skima-phase-bot@users.noreply.github.com"
          git add supabase/functions/_shared/partner-verification.ts \
                  apps/lpg-mobile/src/native/ui/ApplicationOverviewScreen.tsx \
                  scripts/verification-runtime-contract.test.ts \
                  scripts/apply-phase1-verification-dark-mode.mjs \
                  .github/workflows/phase1-verification-dark-mode.yml
          git commit -m "fix: harden partner KYC and onboarding dark mode"
          git push origin HEAD:${{ github.ref_name }}
