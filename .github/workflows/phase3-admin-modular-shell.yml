name: Phase 3 modular SKIMA admin shell

on:
  push:
    branches:
      - phase-3/admin-modular-shell-router
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase3-admin-modular-shell-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phase branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply guarded admin modularization
        run: node scripts/apply-phase3-admin-modular-shell.mjs

      - name: Install admin dependencies
        run: npm --prefix apps/admin ci --no-audit --no-fund

      - name: Typecheck and build admin
        run: npm run admin:check && npm run admin:build

      - name: Remove one-shot patch infrastructure
        run: |
          rm scripts/apply-phase3-admin-modular-shell.mjs
          rm .github/workflows/phase3-admin-modular-shell.yml

      - name: Commit validated modular admin architecture
        run: |
          git config user.name "skima-phase-bot"
          git config user.email "skima-phase-bot@users.noreply.github.com"
          git add apps/admin/src/App.tsx \
                  apps/admin/src/admin-login-view.tsx \
                  apps/admin/src/admin-navigation-config.ts \
                  apps/admin/src/admin-workspace-router.tsx \
                  scripts/apply-phase3-admin-modular-shell.mjs \
                  .github/workflows/phase3-admin-modular-shell.yml
          git commit -m "refactor: modularize SKIMA admin composition shell"
          git push origin HEAD:${{ github.ref_name }}
