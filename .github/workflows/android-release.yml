name: SKIMA Android release

on:
  push:
    branches: [main]
    paths:
      - ".github/release/skima-android-release.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skima-lpg-android-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/lpg-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/lpg-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run check

      - name: Expo Doctor
        continue-on-error: true
        run: npx --yes expo-doctor@latest

      - name: Validate production APK profile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || (echo "::error::Missing GitHub secret EXPO_TOKEN." && exit 1)
          npx --yes eas-cli@latest config --platform android --profile production --non-interactive > /dev/null

  production-apk:
    name: Build production APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/lpg-mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/lpg-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build signed production APK
        run: npx --yes eas-cli@latest build --platform android --profile production --non-interactive --wait

