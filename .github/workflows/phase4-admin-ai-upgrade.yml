name: Phase 4 admin intelligence upgrade

on:
  push:
    branches:
      - phase-4/admin-ai-layers

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Use Deno 2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply Phase 4 intelligence upgrade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-phase4-admin-ai-upgrade.mjs")
          text = path.read_text()
          text = text.replace("const adminObject = oldAdminReturn\\n  .replace(", "const adminObject = oldAdminReturn\n  .replace(")
          text = text.replace("`)\\n  .replace(/", "`)\n  .replace(/")
          path.write_text(text)
          PY
          node scripts/apply-phase4-admin-ai-upgrade.mjs
          python3 - <<'PY'
          from pathlib import Path

          gateway = Path("supabase/functions/api-gateway/index.ts")
          text = gateway.read_text()
          old = '].filter((item): item is Record<string, unknown> => item !== null);'
          new = '].filter((item) => item !== null) as Array<{ key: string; label: string; count: number; severity: string; summary: string }>;'
          if old not in text:
              raise SystemExit("attention digest type target not found")
          gateway.write_text(text.replace(old, new, 1))

          contract = Path("scripts/ai-runtime-contract.test.ts")
          contract_text = contract.read_text()
          old_helper = 'function assertIncludes(value: string, expected: string, message: string): void {'
          new_helper = 'function assertIncludes(value: string, expected: string, message = "Expected source to include required AI runtime contract text"): void {'
          if old_helper not in contract_text:
              raise SystemExit("AI contract helper target not found")
          contract.write_text(contract_text.replace(old_helper, new_helper, 1))
          PY

      - name: Typecheck platform and edge functions
        run: npm run check

      - name: Verify AI runtime contracts
        run: npm run ai-runtime:contract

      - name: Build admin production bundle
        run: npm run deploy:check:admin

      - name: Commit validated source
        run: |
          git rm scripts/apply-phase4-admin-ai-upgrade.mjs .github/workflows/phase4-admin-ai-upgrade.yml
          git add apps/admin/src/admin-ai-workspace.tsx supabase/functions/api-gateway/index.ts scripts/ai-runtime-contract.test.ts
          if git diff --cached --quiet; then
            echo "No validated source changes to commit."
            exit 0
          fi
          git config user.name "skima-phase4-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: upgrade layered admin intelligence"
          git push origin HEAD:phase-4/admin-ai-layers
